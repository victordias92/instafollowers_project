<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento efetuado com sucesso</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 1.5rem;
        }
        .brand { color: #4f46e5; font-weight: 800; text-decoration: none; }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            width: 100%;
            max-width: 28rem;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }
        .icon {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1.5rem;
            border-radius: 9999px;
            background: #d1fae5;
            color: #059669;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 700;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        p { margin: 1rem 0 0; color: #475569; line-height: 1.6; }
        .btn {
            display: inline-flex;
            width: 100%;
            justify-content: center;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            background: #4f46e5;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        .btn:hover { background: #4338ca; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">InstaBoost</a>
    </header>
    <main>
        <div class="card">
            <div class="icon">✓</div>
            <h1>Pagamento efetuado com sucesso!</h1>
            <p>Recebemos a confirmação do seu pagamento. Em breve iniciaremos a entrega do seu pacote.</p>
            <a href="/" class="btn">Voltar para Home</a>
        </div>
    </main>
</body>
</html>
